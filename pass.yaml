- name: "Play 3 - Trigger AEX Workflow with Python Output"
  hosts: localhost
  gather_facts: false
  vars:
    aex_endpoint: "https://mvwsdev.us.bigfixaex.ai/external/api/event/winSpacePredict"
    aex_key_id: "4ceaaede-5d65-402e-8e24-bd0f5adfac7e"
    aex_secret: "3338cdef-8d6b-49e5-841f-f83a9351fb63"
    payload_file: "Windows/disk_reports/aex_payload.json"

  tasks:
    - name: Load JSON payload generated by growth_analysis.py
      ansible.builtin.set_fact:
        storage_payload: "{{ lookup('ansible.builtin.file', payload_file) | from_json }}"

    - name: Trigger AEX Workflow if servers are flagged
      ansible.builtin.uri:
        url: "{{ aex_endpoint }}"
        method: POST
        url_username: "{{ aex_key_id }}"
        url_password: "{{ aex_secret }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body: "{{ storage_payload }}"
        status_code: [200, 201, 202]
        timeout: 120
      register: aex_result
      when: storage_payload.flagged_servers_count | int > 0